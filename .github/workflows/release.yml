name: 'Release Nexus'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Companion APK
        shell: cmd
        run: |
          cd NexusCompanion
          call gradlew.bat assembleRelease
          copy app\build\outputs\apk\release\app-release.apk ..\NexusCompanion.apk

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXUS_STT_KEY: ${{ secrets.NEXUS_STT_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexus v__VERSION__'
          releaseBody: |
            ## Nexus v__VERSION__

            ### Downloads:
            - **Windows Installer:** `Nexus___VERSION___x64-setup.exe` (or `.msi`)
            - **Android Companion App:** `NexusCompanion.apk`

            ### Features:
            - Ambient Voice wake word & desktop automation
            - Nexus Companion Phone Link (120Hz Trackpad & Low-Latency Audio Streaming)
            - Screen selection, OCR, Translate, Visual Lens & Music Finder (`Circle to Search`)
            - Built-in signed auto-updater
          releaseDraft: false
          prerelease: false

      - name: Upload Android Companion APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: NexusCompanion.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
