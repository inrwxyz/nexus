name: 'Release Nexus'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Android Companion APK
        shell: cmd
        run: |
          cd NexusCompanion
          call gradlew.bat assembleRelease -Dorg.gradle.java.home="%JAVA_HOME%"
          copy app\build\outputs\apk\release\app-release.apk ..\NexusCompanion.apk

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXUS_STT_KEY: ${{ secrets.NEXUS_STT_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexus v__VERSION__'
          releaseBody: |
            ## Nexus v__VERSION__

            ### Downloads:
            - **Windows Installer:** `Nexus___VERSION___x64-setup.exe` (or `.msi`)
            - **Android Companion App:** `NexusCompanion.apk`

            ### Highlights:
            - **100% Pure-Rust Native Screen Mirror**: End-to-end Win32 + Direct3D 11 (`ID3D11VideoProcessor`) + Windows Media Foundation H.264/AAC/Opus decoding and `cpal` WASAPI low-latency audio with auto-rotation, `F11` fullscreen, and live Phone Screen Off / Audio controls (zero external mirror executables or DLLs)
            - **First-Run 4-Module Chooser & Low-Memory Tray Trim**: Pick enabled modules on first launch (`Voice`, `Circle to Search`, `Phone Link`, `Screen Mirror`) with zero background overhead for unchecked features
            - **On-Demand Phone Link QR Pairing**: Generates pairing QR codes cleanly on click with full padding + instant sync
            - **Voice AI Assistant (`Voice -> AI & Keys`)**: Optional smart fallback, DPAPI Multi-API Key Vault, natural talkback synced with Inex Island, and Gamepad Profile HUD
            - *Notice:* Speech-to-text uses Google's unofficial Chromium v2 speech endpoint (see README for details & privacy notice).
          releaseDraft: false
          prerelease: false

      - name: Upload Android Companion APK
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/upload_apk.py
