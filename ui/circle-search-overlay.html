<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Circle to Search</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100vw; height: 100vh; overflow: hidden; background: #000;
      font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
      color: #f4f7fb;
    }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
    #bg { z-index: 1; pointer-events: none; }
    #draw { z-index: 2; cursor: crosshair; }

    /* Phone-style 4-edge animated gradient screen border glow */
    .edge-glow {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      box-shadow:
        inset 0 0 46px rgba(6, 182, 212, 0.42),
        inset 0 0 90px rgba(59, 130, 246, 0.22),
        inset 0 0 0 2.5px rgba(103, 232, 249, 0.65);
      animation: edgePulse 2.2s ease-in-out infinite alternate;
    }
    .edge-glow::before {
      content: ''; position: absolute; inset: 0; padding: 3px;
      background: linear-gradient(130deg, rgba(6,182,212,.85), rgba(99,102,241,.65), rgba(56,189,248,.85), rgba(34,211,238,.85));
      background-size: 240% 240%;
      animation: gradShift 5s ease infinite;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: .75;
    }
    @keyframes edgePulse {
      from { box-shadow: inset 0 0 32px rgba(6,182,212,.30), inset 0 0 70px rgba(99,102,241,.18), inset 0 0 0 2px rgba(103,232,249,.5); }
      to   { box-shadow: inset 0 0 58px rgba(6,182,212,.52), inset 0 0 110px rgba(59,130,246,.30), inset 0 0 0 3px rgba(103,232,249,.85); }
    }
    @keyframes gradShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* In-place phone-style live translation overlay layer (100% opaque surface cover) */
    #tr-layer {
      position: fixed; inset: 0; z-index: 8; pointer-events: none; overflow: hidden;
    }
    .tr-box {
      position: fixed; pointer-events: auto; cursor: pointer;
      display: flex; align-items: center;
      padding: 2px 5px; border-radius: 6px;
      line-height: 1.26; font-weight: 500;
      opacity: 1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: transform .1s ease, outline-color .14s ease;
      outline: 1px solid transparent;
    }
    .tr-box:hover {
      transform: scale(1.02);
      outline-color: rgba(6, 182, 212, 0.85);
      z-index: 9;
    }

    /* Right-side Draggable Vertical Action Pill Rail */
    .rail-wrap {
      position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
      z-index: 15; display: flex; flex-direction: column; align-items: center;
    }
    .rail {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      width: 56px; padding: 8px 6px; border-radius: 22px;
      background: rgba(15, 19, 25, 0.90); backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 22px 54px rgba(0, 0, 0, 0.65);
    }
    .drag-grip {
      width: 100%; height: 18px; display: flex; align-items: center; justify-content: center;
      color: #64748b; cursor: grab; border-radius: 10px;
    }
    .drag-grip:active { cursor: grabbing; color: #94a3b8; }
    .rail-sep { width: 28px; height: 1px; background: rgba(255, 255, 255, 0.10); margin: 2px 0; }
    .tool-btn {
      position: relative; width: 42px; height: 42px; border-radius: 14px;
      border: 1px solid transparent; background: transparent; color: #94a3b8;
      display: grid; place-items: center; cursor: pointer;
      transition: background .15s, color .15s, border-color .15s, transform .12s;
    }
    .tool-btn:hover { color: #f4f7fb; background: rgba(255, 255, 255, 0.08); }
    .tool-btn.active {
      color: #67e8f9; background: rgba(6, 182, 212, 0.16);
      border-color: rgba(6, 182, 212, 0.45);
    }
    .tool-btn.close-btn:hover {
      color: #fff; background: rgba(239, 68, 68, 0.24); border-color: rgba(239, 68, 68, 0.45);
    }
    .tool-btn.busy {
      color: #67e8f9; background: rgba(6, 182, 212, 0.24); border-color: rgba(6, 182, 212, 0.7);
      animation: pulseRing 1s ease-in-out infinite alternate;
    }
    @keyframes pulseRing {
      from { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.35); }
      to   { box-shadow: 0 0 0 6px rgba(6, 182, 212, 0); }
    }
    .tool-tip { font-size: 11px; font-weight: 700; letter-spacing: -.02em; }

    /* Tiny sleek inline Language Selector + Google Translate Web Pill (6px gap beside 文A) */
    .lang-pill {
      position: fixed; z-index: 16; display: none; align-items: center; gap: 4px;
      height: 30px; padding: 0 4px 0 0; border-radius: 999px;
      background: rgba(15, 19, 25, 0.94); backdrop-filter: blur(22px);
      border: 1px solid rgba(6, 182, 212, 0.48);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      color: #67e8f9; font-size: 11.5px; font-weight: 600; letter-spacing: .04em;
      white-space: nowrap;
    }
    .lang-pill.open { display: inline-flex; }
    .lang-select-wrap {
      position: relative; display: inline-flex; align-items: center; height: 100%;
      padding: 0 8px 0 11px; border-radius: 999px; cursor: pointer;
    }
    .lang-select-wrap:hover { background: rgba(6, 182, 212, 0.16); }
    .lang-select-wrap select {
      position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
    }
    .lang-select-wrap select option { background: #0f1319; color: #f4f7fb; }
    .lang-sep { width: 1px; height: 14px; background: rgba(255, 255, 255, 0.16); }
    .lang-web-btn {
      height: 22px; padding: 0 9px; border-radius: 999px; border: 0;
      background: rgba(6, 182, 212, 0.16); color: #bae6fd;
      font-size: 11px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 3px;
      transition: background .14s, color .14s;
    }
    .lang-web-btn:hover { background: rgba(6, 182, 212, 0.34); color: #fff; }

    /* Tiny transient chip beside an active rail button (Lens / Music status) */
    .mini-chip {
      position: fixed; z-index: 16; display: none; align-items: center; gap: 7px;
      height: 30px; padding: 0 12px; border-radius: 999px;
      background: rgba(15, 19, 25, 0.94); backdrop-filter: blur(22px);
      border: 1px solid rgba(6, 182, 212, 0.44);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      color: #e2e8f0; font-size: 11.5px; font-weight: 500; white-space: nowrap; max-width: 260px;
      overflow: hidden; text-overflow: ellipsis;
    }
    .mini-chip.open { display: inline-flex; }
    .chip-dot { width: 6px; height: 6px; border-radius: 50%; background: #06b6d4; flex-shrink: 0; }

    /* Floating OCR Result Card (only shown when using [T] Offline OCR tool) */
    .card {
      position: fixed; z-index: 14; width: 340px; max-width: calc(100vw - 24px);
      display: none; flex-direction: column; gap: 10px; padding: 14px;
      border-radius: 18px; background: rgba(15, 19, 25, 0.94);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.38);
      box-shadow: 0 24px 56px rgba(0, 0, 0, 0.68);
    }
    .card.open { display: flex; }
    .card-hdr {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: #38bdf8;
    }
    .card-meta { color: #94a3b8; font-weight: 500; text-transform: none; letter-spacing: 0; }
    .ocr-box {
      width: 100%; min-height: 80px; max-height: 180px; resize: vertical;
      border-radius: 11px; padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f4f7fb; font: 400 12.5px/1.5 'Segoe UI Variable', 'Segoe UI', sans-serif;
      outline: none; user-select: text;
    }
    .ocr-box:focus { border-color: rgba(6, 182, 212, 0.65); }
    .ocr-box.empty { color: #94a3b8; font-style: italic; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .act-btn {
      flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 11px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07); color: #e2e8f0;
      transition: background .14s, border-color .14s, transform .1s;
    }
    .act-btn:hover { background: rgba(255, 255, 255, 0.14); border-color: rgba(255, 255, 255, 0.25); }
    .act-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Quick-action bar for Default Action = Show Options ('ask') */
    .ask-bar {
      position: fixed; z-index: 14; display: none; align-items: center; gap: 6px;
      padding: 6px; border-radius: 999px;
      background: rgba(15, 19, 25, 0.94); backdrop-filter: blur(24px);
      border: 1px solid rgba(6, 182, 212, 0.44);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.68);
    }
    .ask-bar.open { display: inline-flex; }
    .ask-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 12px; border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06); color: #e2e8f0;
      font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
      transition: background .14s, border-color .14s, color .14s;
    }
    .ask-btn:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
    .ask-btn.primary {
      background: rgba(6, 182, 212, 0.22); border-color: rgba(6, 182, 212, 0.55); color: #67e8f9;
    }
    .ask-btn.primary:hover { background: rgba(6, 182, 212, 0.34); }
    .ask-btn.icon-only { padding: 0 9px; color: #94a3b8; }

    /* Tiny transient copy toast */
    .copy-toast {
      position: fixed; z-index: 25; bottom: 26px; left: 50%; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
      color: #67e8f9; background: rgba(15, 19, 25, 0.94); backdrop-filter: blur(18px);
      border: 1px solid rgba(6, 182, 212, 0.5); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      opacity: 0; pointer-events: none; transition: opacity .16s ease;
    }
    .copy-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="draw"></canvas>
  <div id="tr-layer"></div>
  <div class="edge-glow"></div>

  <!-- Draggable Right-Side Vertical Action Pill -->
  <div class="rail-wrap" id="rail-wrap">
    <div class="rail" id="rail">
      <div class="drag-grip" id="rail-grip" title="Drag toolbar anywhere">
        <svg viewBox="0 0 24 12" width="18" height="10" fill="currentColor"><circle cx="6" cy="3" r="1.4"/><circle cx="12" cy="3" r="1.4"/><circle cx="18" cy="3" r="1.4"/><circle cx="6" cy="9" r="1.4"/><circle cx="12" cy="9" r="1.4"/><circle cx="18" cy="9" r="1.4"/></svg>
      </div>
      <div class="rail-sep"></div>

      <button class="tool-btn" id="tool-lasso" data-tool="lasso" title="Visual Search (Circle product, person, or image)">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      </button>

      <button class="tool-btn" id="tool-translate" data-tool="translate" title="Translate Screen In-Place">
        <span class="tool-tip">文A</span>
      </button>

      <button class="tool-btn" id="tool-music" title="Recognize Desktop Music">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </button>

      <button class="tool-btn" id="tool-ocr" data-tool="ocr" title="Offline Text Copy (OCR)">
        <span class="tool-tip">[T]</span>
      </button>

      <div class="rail-sep"></div>

      <button class="tool-btn close-btn" id="btn-close-overlay" title="Close (Esc)">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Tiny sleek Language Selector + Google Translate Web Pill (6px gap next to 文A) -->
  <div class="lang-pill" id="lang-pill">
    <div class="lang-select-wrap" title="Target translation language">
      <span id="lang-badge">BN ▾</span>
      <select id="pop-lang" aria-label="Target Language">
        <option value="bn">Bengali (bn)</option>
        <option value="en">English (en)</option>
        <option value="hi">Hindi (hi)</option>
        <option value="es">Spanish (es)</option>
        <option value="ja">Japanese (ja)</option>
        <option value="fr">French (fr)</option>
        <option value="de">German (de)</option>
        <option value="ar">Arabic (ar)</option>
        <option value="ko">Korean (ko)</option>
        <option value="zh-CN">Chinese (zh-CN)</option>
        <option value="pt">Portuguese (pt)</option>
        <option value="ru">Russian (ru)</option>
      </select>
    </div>
    <span class="lang-sep"></span>
    <button type="button" class="lang-web-btn" id="btn-gtranslate" title="Open in Google Translate Images (auto-detects all languages)">G-Translate ↗</button>
  </div>

  <!-- Tiny transient status pill beside active rail icon (Lens / Music) -->
  <div class="mini-chip" id="mini-chip">
    <span class="chip-dot"></span>
    <span id="mini-chip-text">Listening to PC audio…</span>
  </div>

  <!-- Quick Action Bar shown when Default Action is Show Options ('ask') -->
  <div class="ask-bar" id="ask-bar">
    <button class="ask-btn primary" id="ask-lens" type="button">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <span>Google Lens</span>
    </button>
    <button class="ask-btn" id="ask-ocr" type="button"><span>Copy Text</span></button>
    <button class="ask-btn" id="ask-translate" type="button"><span>Translate</span></button>
    <button class="ask-btn" id="ask-gtranslate" type="button" title="Translate image in Google Translate (all languages)"><span>G-Translate ↗</span></button>
    <button class="ask-btn icon-only" id="ask-redraw" type="button" title="Redraw">✕</button>
  </div>

  <!-- Floating OCR Result Card (used only for [T] Offline OCR copy mode) -->
  <div class="card" id="result-card">
    <div class="card-hdr">
      <span>Offline OCR</span>
      <span class="card-meta" id="sel-size"></span>
    </div>
    <textarea class="ocr-box empty" id="ocr-text" readonly placeholder="Scanning text…"></textarea>
    <div class="actions">
      <button class="act-btn" id="btn-copy" type="button" disabled>Copy</button>
      <button class="act-btn" id="btn-web" type="button" disabled>Search Web</button>
      <button class="act-btn" id="btn-redraw" type="button">Redraw</button>
    </div>
  </div>

  <div class="copy-toast" id="copy-toast">Copied</div>

  <script>
    const T = window.__TAURI__;
    const bg = document.getElementById('bg');
    const draw = document.getElementById('draw');
    const trLayer = document.getElementById('tr-layer');
    const bgCtx = bg.getContext('2d');
    const ctx = draw.getContext('2d');

    const railWrap = document.getElementById('rail-wrap');
    const railGrip = document.getElementById('rail-grip');
    const toolLasso = document.getElementById('tool-lasso');
    const toolTranslate = document.getElementById('tool-translate');
    const toolMusic = document.getElementById('tool-music');
    const langPill = document.getElementById('lang-pill');
    const langBadge = document.getElementById('lang-badge');
    const popLang = document.getElementById('pop-lang');
    const btnGTranslate = document.getElementById('btn-gtranslate');
    const miniChip = document.getElementById('mini-chip');
    const miniChipText = document.getElementById('mini-chip-text');

    const card = document.getElementById('result-card');
    const ocrBox = document.getElementById('ocr-text');
    const selSizeEl = document.getElementById('sel-size');
    const btnCopy = document.getElementById('btn-copy');
    const btnWeb = document.getElementById('btn-web');
    const btnRedraw = document.getElementById('btn-redraw');
    const btnClose = document.getElementById('btn-close-overlay');
    const copyToast = document.getElementById('copy-toast');
    const askBar = document.getElementById('ask-bar');
    const askLens = document.getElementById('ask-lens');
    const askOcr = document.getElementById('ask-ocr');
    const askTranslate = document.getElementById('ask-translate');
    const askGTranslate = document.getElementById('ask-gtranslate');
    const askRedraw = document.getElementById('ask-redraw');

    let frameUrl = null;
    let initInfo = { width: window.innerWidth, height: window.innerHeight, default_action: 'ask', target_lang: 'bn', translate_mode: 'in_place' };
    let activeTool = 'ask'; // 'ask' | 'lasso' | 'translate' | 'ocr'
    let drawing = false;
    let points = [];
    let activeBox = null;
    let activePhys = null;
    let lastTranslatePhys = { x: 0, y: 0, width: 0, height: 0 };
    let translateReqSeq = 0;
    let musicListening = false;
    let closing = false;
    let toastTimer = null;

    function showToast(msg, durationMs = 1400) {
      copyToast.textContent = msg;
      copyToast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => copyToast.classList.remove('show'), durationMs);
    }

    function shortLangLabel(code) {
      return (code || 'en').split('-')[0].toUpperCase() + ' ▾';
    }

    function anchorRailToPixels() {
      const r = railWrap.getBoundingClientRect();
      railWrap.style.left = `${Math.round(r.left)}px`;
      railWrap.style.top = `${Math.round(r.top)}px`;
      railWrap.style.right = 'auto';
      railWrap.style.transform = 'none';
    }

    // Position a tiny floating pill cleanly with a tight 6px gap beside a button on the rail
    function positionBesideButton(el, btnEl) {
      const rr = railWrap.getBoundingClientRect();
      const br = btnEl.getBoundingClientRect();
      const ew = el.offsetWidth || 72;
      const eh = el.offsetHeight || 30;
      let left = rr.left - ew - 6;
      if (left < 8) left = Math.min(window.innerWidth - ew - 8, rr.right + 6);
      const top = Math.max(8, Math.min(window.innerHeight - eh - 8, br.top + (br.height - eh) / 2));
      el.style.left = `${Math.round(left)}px`;
      el.style.top = `${Math.round(top)}px`;
    }

    function positionAllAttachments() {
      if (langPill.classList.contains('open')) positionBesideButton(langPill, toolTranslate);
      if (miniChip.classList.contains('open')) {
        positionBesideButton(miniChip, musicListening ? toolMusic : toolLasso);
      }
    }

    // Freely draggable Vertical Action Pill
    (function enableRailDrag() {
      let draggingRail = false, startX = 0, startY = 0, baseL = 0, baseT = 0;
      railGrip.addEventListener('pointerdown', e => {
        e.preventDefault(); e.stopPropagation();
        anchorRailToPixels();
        const r = railWrap.getBoundingClientRect();
        draggingRail = true; startX = e.clientX; startY = e.clientY; baseL = r.left; baseT = r.top;
        railGrip.setPointerCapture(e.pointerId);
      });
      railGrip.addEventListener('pointermove', e => {
        if (!draggingRail) return;
        const r = railWrap.getBoundingClientRect();
        const nl = Math.max(8, Math.min(window.innerWidth - r.width - 8, baseL + (e.clientX - startX)));
        const nt = Math.max(8, Math.min(window.innerHeight - r.height - 8, baseT + (e.clientY - startY)));
        railWrap.style.left = `${Math.round(nl)}px`;
        railWrap.style.top = `${Math.round(nt)}px`;
        positionAllAttachments();
      });
      const endDrag = () => { draggingRail = false; };
      railGrip.addEventListener('pointerup', endDrag);
      railGrip.addEventListener('pointercancel', endDrag);
    })();

    function showChip(anchorBtn, text) {
      miniChipText.textContent = text;
      miniChip.classList.add('open');
      positionBesideButton(miniChip, anchorBtn);
    }

    function hideChip() {
      miniChip.classList.remove('open');
    }

    function clearInPlaceTranslation() {
      trLayer.textContent = '';
    }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === tool));
      hideChip();
      askBar.classList.remove('open');

      if (tool === 'translate') {
        card.classList.remove('open');
        activeBox = null;
        activePhys = null;
        points = [];
        renderScrim(null, []);
        langBadge.textContent = shortLangLabel(popLang.value);
        langPill.classList.add('open');
        positionBesideButton(langPill, toolTranslate);
        if (initInfo.translate_mode === 'google_web') {
          clearInPlaceTranslation();
          showToast('Draw area for Google Translate, or click G-Translate ↗ for full screen', 2800);
        } else {
          // Immediately trigger full-screen in-place translation automatically
          runTranslate({ x: 0, y: 0, width: 0, height: 0 });
        }
      } else {
        langPill.classList.remove('open');
        clearInPlaceTranslation();
        card.classList.remove('open');
      }
    }

    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => setTool(btn.dataset.tool));
    });

    popLang.addEventListener('change', () => {
      langBadge.textContent = shortLangLabel(popLang.value);
      positionBesideButton(langPill, toolTranslate);
      if (activeTool === 'translate' && initInfo.translate_mode !== 'google_web') {
        runTranslate(lastTranslatePhys || { x: 0, y: 0, width: 0, height: 0 });
      }
    });

    btnGTranslate.addEventListener('click', async () => {
      const target = activePhys || lastTranslatePhys || { x: 0, y: 0, width: 0, height: 0 };
      await launchGoogleTranslateWeb(target);
    });

    toolMusic.addEventListener('click', async () => {
      if (musicListening || closing) return;
      musicListening = true;
      closing = true;
      askBar.classList.remove('open');
      clearInPlaceTranslation();
      card.classList.remove('open');
      langPill.classList.remove('open');
      hideChip();
      toolMusic.classList.add('busy');

      try {
        await T.core.invoke('recognize_desktop_music');
        cleanupResources();
      } catch (e) {
        closing = false;
        musicListening = false;
        toolMusic.classList.remove('busy');
        showChip(toolMusic, `Audio error: ${e}`);
        setTimeout(() => { if (!musicListening) hideChip(); }, 2500);
      }
    });

    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      draw.width = Math.max(1, Math.round(window.innerWidth * dpr));
      draw.height = Math.max(1, Math.round(window.innerHeight * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      renderScrim(activeBox, points);
    }

    function renderScrim(box, pts) {
      const vw = window.innerWidth, vh = window.innerHeight;
      ctx.clearRect(0, 0, vw, vh);
      ctx.fillStyle = box ? 'rgba(6, 10, 16, 0.44)' : 'rgba(6, 10, 16, 0.14)';
      ctx.fillRect(0, 0, vw, vh);

      if (box) {
        ctx.save();
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.roundRect(box.x, box.y, box.w, box.h, 12);
        ctx.fill();
        ctx.restore();

        ctx.save();
        const grad = ctx.createLinearGradient(box.x, box.y, box.x + box.w, box.y + box.h);
        grad.addColorStop(0, '#67e8f9');
        grad.addColorStop(0.5, '#06b6d4');
        grad.addColorStop(1, '#3b82f6');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5;
        ctx.shadowColor = 'rgba(6, 182, 212, 0.75)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.roundRect(box.x, box.y, box.w, box.h, 12);
        ctx.stroke();
        ctx.restore();
      }

      if (pts && pts.length > 1) {
        ctx.save();
        const grad = ctx.createLinearGradient(pts[0].x, pts[0].y, pts[pts.length - 1].x, pts[pts.length - 1].y);
        grad.addColorStop(0, '#67e8f9');
        grad.addColorStop(0.5, '#06b6d4');
        grad.addColorStop(1, '#6366f1');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowColor = 'rgba(6, 182, 212, 0.9)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.stroke();
        ctx.restore();
      }
    }

    function resetSelection() {
      const hadBox = !!activeBox;
      activeBox = null; activePhys = null; points = [];
      askBar.classList.remove('open');
      card.classList.remove('open');
      ocrBox.value = ''; ocrBox.classList.add('empty');
      btnCopy.disabled = true; btnWeb.disabled = true;
      if (activeTool === 'translate' && !hadBox) {
        renderScrim(null, []);
      } else {
        lastTranslatePhys = { x: 0, y: 0, width: 0, height: 0 };
        clearInPlaceTranslation();
        renderScrim(null, []);
      }
    }

    function positionAskBar(box) {
      if (!box) return;
      askBar.classList.add('open');
      const vw = window.innerWidth, vh = window.innerHeight;
      const bw = askBar.offsetWidth || 320, bh = askBar.offsetHeight || 44;
      const left = Math.max(12, Math.min(vw - bw - 86, box.x + (box.w - bw) / 2));
      let top = box.y + box.h + 10;
      if (top + bh > vh - 12) top = box.y - bh - 10;
      if (top < 12) top = Math.max(12, vh - bh - 12);
      askBar.style.left = `${Math.round(left)}px`;
      askBar.style.top = `${Math.round(top)}px`;
    }

    function cssBoxToPhysical(box) {
      const sx = initInfo.width / Math.max(1, window.innerWidth);
      const sy = initInfo.height / Math.max(1, window.innerHeight);
      return {
        x: Math.max(0, Math.round(box.x * sx)),
        y: Math.max(0, Math.round(box.y * sy)),
        width: Math.max(1, Math.round(box.w * sx)),
        height: Math.max(1, Math.round(box.h * sy)),
      };
    }

    function positionCard(box) {
      if (!box) return;
      card.classList.add('open');
      const vw = window.innerWidth, vh = window.innerHeight;
      const cw = 340, ch = card.offsetHeight || 200;
      let left = Math.max(12, Math.min(vw - cw - 86, box.x));
      let top = box.y + box.h + 12;
      if (top + ch > vh - 12) top = box.y - ch - 12;
      if (top < 16) top = Math.max(16, vh - ch - 16);
      card.style.left = `${Math.round(left)}px`;
      card.style.top = `${Math.round(top)}px`;
    }

    async function runOcr(phys) {
      clearInPlaceTranslation();
      ocrBox.value = 'Extracting text offline…'; ocrBox.classList.add('empty');
      btnCopy.disabled = true; btnWeb.disabled = true;
      try {
        const res = await T.core.invoke('process_circle_selection', {
          x: phys.x, y: phys.y, width: phys.width, height: phys.height, mode: 'ocr'
        });
        if (res.error) { ocrBox.value = res.error; return; }
        const txt = (res.text || '').trim();
        if (txt) {
          ocrBox.value = txt; ocrBox.classList.remove('empty');
          btnCopy.disabled = false; btnWeb.disabled = false;
        } else {
          ocrBox.value = 'No text detected in this area.';
        }
      } catch (e) { ocrBox.value = `OCR failed: ${e}`; }
    }

    function renderInPlaceLines(lines) {
      clearInPlaceTranslation();
      const sx = window.innerWidth / Math.max(1, initInfo.width);
      const sy = window.innerHeight / Math.max(1, initInfo.height);

      for (const item of lines) {
        // 3px-4px padded solid surface shield covers shadowed UI & desktop icon outlines cleanly
        const cssX = Math.max(0, item.x * sx - 4);
        const cssY = Math.max(0, item.y * sy - 3);
        const cssW = Math.max(20, item.width * sx + 8);
        const cssH = Math.max(18, item.height * sy + 6);
        const maxW = Math.max(cssW * 1.65, Math.min(window.innerWidth - cssX - 8, cssW + 120));

        const el = document.createElement('div');
        el.className = 'tr-box';
        el.title = `${item.source_text}\nClick to copy`;
        el.textContent = item.translated_text;
        el.style.left = `${cssX.toFixed(1)}px`;
        el.style.top = `${cssY.toFixed(1)}px`;
        el.style.minWidth = `${cssW.toFixed(1)}px`;
        el.style.maxWidth = `${maxW.toFixed(1)}px`;
        el.style.minHeight = `${cssH.toFixed(1)}px`;
        el.style.background = item.bg_color || 'rgb(15, 19, 25)';
        el.style.color = item.fg_color || '#f8fafc';

        let fs = Math.max(10.0, Math.min(44, (item.height * sy) * 0.78));
        el.style.fontSize = `${fs.toFixed(1)}px`;
        trLayer.appendChild(el);

        if (el.scrollWidth > maxW + 1) {
          fs = Math.max(8.5, fs * (maxW / el.scrollWidth));
          el.style.fontSize = `${fs.toFixed(1)}px`;
        }

        el.addEventListener('click', async ev => {
          ev.stopPropagation();
          try {
            await T.core.invoke('copy_circle_text', { text: item.translated_text });
            showToast('Copied');
          } catch (_) {}
        });
      }
    }

    async function runTranslate(phys) {
      const reqSeq = ++translateReqSeq;
      const tl = popLang.value || 'en';
      lastTranslatePhys = phys;
      card.classList.remove('open');
      toolTranslate.classList.add('busy');
      langBadge.textContent = `${(tl.split('-')[0]).toUpperCase()} …`;
      positionBesideButton(langPill, toolTranslate);

      try {
        const res = await T.core.invoke('translate_selection', {
          x: phys.x, y: phys.y, width: phys.width, height: phys.height, targetLang: tl
        });
        if (reqSeq !== translateReqSeq || closing) return;
        if (res.error || !res.ok || !res.lines || res.lines.length === 0) {
          clearInPlaceTranslation();
          const msg = (!res.error || res.error.includes('No readable text'))
            ? 'No local OCR text — click G-Translate ↗ for all languages'
            : res.error;
          showToast(msg, 3400);
          return;
        }
        renderInPlaceLines(res.lines);
      } catch (e) {
        if (reqSeq !== translateReqSeq || closing) return;
        clearInPlaceTranslation();
        showToast(`Translate error: ${e}`, 3400);
      } finally {
        if (reqSeq === translateReqSeq) {
          toolTranslate.classList.remove('busy');
          langBadge.textContent = shortLangLabel(popLang.value);
          positionBesideButton(langPill, toolTranslate);
        }
      }
    }

    async function launchGoogleTranslateWeb(phys) {
      const p = phys || { x: 0, y: 0, width: 0, height: 0 };
      const tl = popLang.value || 'bn';
      toolTranslate.classList.add('busy');
      showChip(toolTranslate, 'Opening Google Translate…');
      try {
        await T.core.invoke('google_translate_image', {
          x: p.x, y: p.y, width: p.width, height: p.height, targetLang: tl
        });
        cleanupResources();
      } catch (e) {
        hideChip();
        toolTranslate.classList.remove('busy');
        showToast(`Google Translate failed: ${e}`, 3400);
      }
    }

    async function launchLens(phys) {
      if (!phys) return;
      toolLasso.classList.add('busy');
      showChip(toolLasso, 'Searching Google Lens…');
      try {
        await T.core.invoke('lens_visual_search', {
          x: phys.x, y: phys.y, width: phys.width, height: phys.height
        });
        cleanupResources();
      } catch (e) {
        hideChip();
        toolLasso.classList.remove('busy');
        showToast(`Visual search failed: ${e}`);
      }
    }

    function cleanupResources() {
      clearInPlaceTranslation();
      askBar.classList.remove('open');
      if (frameUrl) { URL.revokeObjectURL(frameUrl); frameUrl = null; }
      bg.width = 0; bg.height = 0; draw.width = 0; draw.height = 0;
    }

    async function closeOverlay() {
      if (closing) return;
      closing = true;
      cleanupResources();
      try { if (T && T.core) await T.core.invoke('close_circle_search_overlay'); } catch (_) {}
    }

    draw.addEventListener('pointerdown', e => {
      if (e.button !== 0 || closing) return;
      if (!musicListening) hideChip();
      askBar.classList.remove('open');
      card.classList.remove('open');
      if (activeTool !== 'translate') clearInPlaceTranslation();
      drawing = true;
      points = [{ x: e.clientX, y: e.clientY }];
      draw.setPointerCapture(e.pointerId);
      renderScrim(null, points);
    });

    draw.addEventListener('pointermove', e => {
      if (!drawing) return;
      const last = points[points.length - 1];
      if (!last || Math.hypot(e.clientX - last.x, e.clientY - last.y) >= 3) {
        points.push({ x: e.clientX, y: e.clientY });
        renderScrim(null, points);
      }
    });

    async function finishStroke() {
      if (!drawing) return;
      drawing = false;
      if (points.length < 2) { resetSelection(); return; }

      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of points) {
        if (p.x < minX) minX = p.x; if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x; if (p.y > maxY) maxY = p.y;
      }
      if (maxY - minY < 16 && maxX - minX >= 20) { minY -= 8; maxY += 8; }
      minX = Math.max(0, minX); minY = Math.max(0, minY);
      maxX = Math.min(window.innerWidth, maxX); maxY = Math.min(window.innerHeight, maxY);

      const box = { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
      if (box.w < 10 || box.h < 10) { resetSelection(); return; }

      activeBox = box;
      activePhys = cssBoxToPhysical(box);
      selSizeEl.textContent = `${activePhys.width} × ${activePhys.height}`;
      renderScrim(box, []);

      if (activeTool === 'translate') {
        if (initInfo.translate_mode === 'google_web') {
          await launchGoogleTranslateWeb(activePhys);
        } else {
          await runTranslate(activePhys);
        }
      } else if (activeTool === 'ocr') {
        positionCard(box);
        await runOcr(activePhys);
      } else if (activeTool === 'lasso') {
        await launchLens(activePhys);
      } else {
        positionAskBar(box);
      }
    }

    draw.addEventListener('pointerup', finishStroke);
    draw.addEventListener('pointercancel', () => { drawing = false; resetSelection(); });

    askLens.addEventListener('click', async () => {
      if (!activePhys) return;
      askBar.classList.remove('open');
      await launchLens(activePhys);
    });
    askOcr.addEventListener('click', async () => {
      if (!activePhys || !activeBox) return;
      askBar.classList.remove('open');
      positionCard(activeBox);
      await runOcr(activePhys);
    });
    askTranslate.addEventListener('click', async () => {
      if (!activePhys) return;
      askBar.classList.remove('open');
      if (initInfo.translate_mode === 'google_web') {
        await launchGoogleTranslateWeb(activePhys);
        return;
      }
      activeTool = 'translate';
      document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === 'translate'));
      langBadge.textContent = shortLangLabel(popLang.value);
      langPill.classList.add('open');
      positionBesideButton(langPill, toolTranslate);
      await runTranslate(activePhys);
    });
    askGTranslate.addEventListener('click', async () => {
      if (!activePhys) return;
      askBar.classList.remove('open');
      await launchGoogleTranslateWeb(activePhys);
    });
    askRedraw.addEventListener('click', resetSelection);

    btnClose.addEventListener('click', closeOverlay);
    btnRedraw.addEventListener('click', resetSelection);

    btnCopy.addEventListener('click', async () => {
      const txt = ocrBox.value.trim();
      if (!txt) return;
      try {
        await T.core.invoke('copy_circle_text', { text: txt });
        const orig = btnCopy.textContent;
        btnCopy.textContent = 'Copied!';
        setTimeout(() => { btnCopy.textContent = orig; }, 1300);
      } catch (_) {}
    });

    btnWeb.addEventListener('click', async () => {
      const txt = ocrBox.value.trim();
      if (!txt) return;
      cleanupResources();
      try { await T.core.invoke('search_circle_text', { query: txt }); } catch (_) {}
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.preventDefault(); closeOverlay(); }
    });
    window.addEventListener('resize', resizeCanvases);
    window.addEventListener('beforeunload', cleanupResources);

    (async function boot() {
      resizeCanvases();
      try {
        const raw = await T.core.invoke('get_frozen_frame');
        const blob = new Blob([raw], { type: 'image/bmp' });
        frameUrl = URL.createObjectURL(blob);
        const img = new Image();
        const done = async () => {
          initInfo = await T.core.invoke('overlay_ready');
          if (initInfo.target_lang && [...popLang.options].some(o => o.value === initInfo.target_lang)) {
            popLang.value = initInfo.target_lang;
          }
          langBadge.textContent = shortLangLabel(popLang.value);
          anchorRailToPixels();
          if (initInfo.default_action === 'translate') setTool('translate');
          else if (initInfo.default_action === 'ocr') setTool('ocr');
          else if (initInfo.default_action === 'lens') setTool('lasso');
          else setTool('ask');
        };
        img.onload = async () => {
          bg.width = img.naturalWidth || window.innerWidth;
          bg.height = img.naturalHeight || window.innerHeight;
          bgCtx.drawImage(img, 0, 0, bg.width, bg.height);
          URL.revokeObjectURL(frameUrl);
          frameUrl = null;
          await done();
        };
        img.onerror = done;
        img.src = frameUrl;
      } catch (e) {
        console.error('Overlay init failed:', e);
        try { await T.core.invoke('overlay_ready'); } catch (_) {}
      }
    })();
  </script>
</body>
</html>
