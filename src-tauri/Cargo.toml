[package]
name = "nexus"
version = "1.0.0"
description = "Nexus - Ambient Voice Automation"
authors = ["inrwxyz"]
edition = "2021"
default-run = "nexus"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ureq = { version = "2", default-features = false, features = ["tls"] }
strsim = "0.11"
png = "0.18.1"
reqwest = { version = "0.13", features = ["multipart", "json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
crc32fast = "1"
windows = { version = "0.59", features = ["Media_Control", "Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 2
lto = "thin"
strip = false
