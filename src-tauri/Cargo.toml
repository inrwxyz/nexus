[package]
name = "nexus"
version = "2.0.1"
description = "Nexus - Ambient Voice Automation"
authors = ["inrwxyz"]
edition = "2021"
default-run = "nexus"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-mirror-engine = { path = "../mirror-engine" }
tokio = { version = "1", features = ["time", "rt", "net", "io-util", "sync"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
ureq = { version = "2", default-features = false, features = ["tls"] }
strsim = "0.11"
png = "0.18.1"
reqwest = { version = "0.13", features = ["multipart", "json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
crc32fast = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
windows-core = "0.59"
windows = { version = "0.59", features = ["ApplicationModel_DataTransfer", "Win32_Devices_FunctionDiscovery", "Win32_NetworkManagement_IpHelper", "Media_Control", "Media_Core", "Media_Ocr", "Media_SpeechSynthesis", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_MediaFoundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Power",
    "Win32_Devices_Display",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
] }

[target.'cfg(windows)'.dependencies.wmi]
version = "0.14"

[target.'cfg(windows)'.dependencies.webview2-com]
version = "0.39"

[target.'cfg(windows)'.dependencies.windows_core_062]
package = "windows-core"
version = "0.62"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
